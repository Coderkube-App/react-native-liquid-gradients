<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;family=Inter:wght@400;600;700&amp;display=swap');
      .fm{font-family:'Fira Code',monospace}.fs{font-family:'Inter',sans-serif}

      /* GPU Mesh Gradient Blob Movements */
      @keyframes float1 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(35px, -25px) scale(1.15); }
      }
      @keyframes float2 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-25px, 30px) scale(0.9); }
      }
      @keyframes float3 {
        0%, 100% { transform: translate(0, 0) scale(1.05); }
        50% { transform: translate(25px, 35px) scale(0.85); }
      }
      @keyframes float4 {
        0%, 100% { transform: translate(0, 0) scale(0.9); }
        50% { transform: translate(-35px, -15px) scale(1.1); }
      }

      .blob1 { animation: float1 8s ease-in-out infinite; }
      .blob2 { animation: float2 9s ease-in-out infinite; }
      .blob3 { animation: float3 7s ease-in-out infinite; }
      .blob4 { animation: float4 10s ease-in-out infinite; }

      /* Typewriter commands */
      @keyframes type1 { 0%, 5% { width: 0; } 18%, 100% { width: 220px; } }
      @keyframes type2 { 0%, 40% { width: 0; } 58%, 100% { width: 155px; } }
      .cmd1 { animation: type1 12s linear infinite; }
      .cmd2 { animation: type2 12s linear infinite; }

      @keyframes cursor1Move {
        0%, 5% { transform: translateX(0); opacity: 1; }
        18% { transform: translateX(220px); opacity: 1; }
        22%, 100% { transform: translateX(220px); opacity: 0; }
      }
      @keyframes cursor2Move {
        0%, 40% { transform: translateX(0); opacity: 0; }
        41% { transform: translateX(0); opacity: 1; }
        58% { transform: translateX(155px); opacity: 1; }
        63%, 100% { transform: translateX(155px); opacity: 0; }
      }
      .cur1 { animation: cursor1Move 12s linear infinite, blink 1s step-end infinite; }
      .cur2 { animation: cursor2Move 12s linear infinite, blink 1s step-end infinite; }

      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

      /* Terminal logs timings */
      @keyframes showL1 { 0%, 21.9% { opacity: 0; } 22%, 100% { opacity: 1; } }
      @keyframes showL2 { 0%, 39.9% { opacity: 0; } 40%, 100% { opacity: 1; } }
      @keyframes showL3 { 0%, 59.9% { opacity: 0; } 60%, 100% { opacity: 1; } }
      @keyframes showL4 { 0%, 69.9% { opacity: 0; } 70%, 100% { opacity: 1; } }
      @keyframes showL5 { 0%, 82.9% { opacity: 0; } 83%, 100% { opacity: 1; } }
      @keyframes showL6 { 0%, 91.9% { opacity: 0; } 92%, 100% { opacity: 1; } }
      .log1 { animation: showL1 12s step-end infinite; }
      .log2 { animation: showL2 12s step-end infinite; }
      .log3 { animation: showL3 12s step-end infinite; }
      .log4 { animation: showL4 12s step-end infinite; }
      .log5 { animation: showL5 12s step-end infinite; }
      .log6 { animation: showL6 12s step-end infinite; }
    </style>

    <!-- Filters &amp; Clips -->
    <filter id="ds"><feDropShadow dx="0" dy="6" stdDeviation="15" flood-color="#000" flood-opacity=".6"/></filter>
    <filter id="mesh-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="32" />
    </filter>

    <clipPath id="phone-clip">
      <rect x="80" y="60" width="220" height="240" rx="28" />
    </clipPath>

    <!-- UI Background Glows -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    
    <!-- Clips for typewriter -->
    <clipPath id="clip-c1"><rect class="cmd1" x="16" y="-8" width="0" height="20" /></clipPath>
    <clipPath id="clip-c2"><rect class="cmd2" x="16" y="36" width="0" height="20" /></clipPath>

    <!-- Grid pattern for debugger view -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect fill="#04050a" width="860" height="520" rx="16" />
  <rect fill="url(#bg-glow)" width="860" height="520" rx="16" />

  <!-- Top Title -->
  <text class="fs" x="430" y="30" fill="#a78bfa" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="3" opacity="0.6">GPU-ACCELERATED FLUID MESH GRADIENT BACKDROP</text>

  <!-- ════════════ COLUMN 1: DEVICE PREVIEW (BLURRED OUTPUT) ════════════ -->
  <g transform="translate(0, 0)" filter="url(#ds)">
    <!-- Device Frame Outer -->
    <rect x="76" y="56" width="228" height="248" rx="32" fill="#1e1e24" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
    
    <!-- Render Area (Clipped Phone Screen) -->
    <g clip-path="url(#phone-clip)">
      <!-- Deep dark background inside phone -->
      <rect x="80" y="60" width="220" height="240" fill="#080710" />
      
      <!-- Blurred mesh gradient container -->
      <g filter="url(#mesh-blur)">
        <!-- Circle Blobs moving with independent float animations -->
        <circle class="blob1" cx="130" cy="110" r="50" fill="#8b5cf6" opacity="0.85" />
        <circle class="blob2" cx="230" cy="150" r="55" fill="#ec4899" opacity="0.75" />
        <circle class="blob3" cx="140" cy="210" r="60" fill="#06b6d4" opacity="0.80" />
        <circle class="blob4" cx="220" cy="220" r="45" fill="#10b981" opacity="0.70" />
      </g>
      
      <!-- Overlaid translucent app UI -->
      <rect x="95" y="100" width="190" height="150" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text class="fs" x="190" y="125" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" opacity="0.9">Fluid UI Design</text>
      
      <!-- Input fields card mockups -->
      <rect x="110" y="145" width="160" height="16" rx="4" fill="rgba(255,255,255,0.08)" />
      <circle cx="120" cy="153" r="3" fill="rgba(255,255,255,0.3)" />
      <rect x="130" y="150" width="60" height="6" rx="2" fill="rgba(255,255,255,0.2)" />

      <rect x="110" y="170" width="160" height="16" rx="4" fill="rgba(255,255,255,0.08)" />
      <circle cx="120" cy="178" r="3" fill="rgba(255,255,255,0.3)" />
      <rect x="130" y="175" width="80" height="6" rx="2" fill="rgba(255,255,255,0.2)" />

      <!-- Action Button -->
      <rect x="110" y="205" width="160" height="20" rx="6" fill="#8b5cf6" stroke="rgba(255,255,255,0.2)" stroke-width="0.5" />
      <text class="fs" x="190" y="218" fill="#ffffff" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0.5">GET STARTED</text>
    </g>

    <!-- Caption -->
    <text class="fs" x="190" y="325" fill="#a78bfa" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">BLURRED FRAMEPREVIEW</text>
  </g>

  <!-- Flow connecting vector lines -->
  <line x1="310" y1="180" x2="540" y2="180" stroke="rgba(124, 92, 246, 0.25)" stroke-width="1.5" stroke-dasharray="4,4" />
  <polygon points="540,176 548,180 540,184" fill="#8b5cf6" opacity="0.6" />
  <rect x="385" y="168" width="80" height="24" rx="12" fill="#0d1117" stroke="rgba(124, 92, 246, 0.4)" stroke-width="1" />
  <text class="fs" x="425" y="183" fill="#a78bfa" font-size="8.5" font-weight="700" text-anchor="middle">GPU FLOW</text>

  <!-- ════════════ COLUMN 3: DEBBUGER ANCHORS (UNBLURRED BLOBS) ════════════ -->
  <g transform="translate(550, 60)" filter="url(#ds)">
    <rect width="230" height="240" rx="12" fill="#0d1117" stroke="rgba(6, 182, 212, 0.2)" stroke-width="1.5" />
    <rect width="230" height="24" rx="12" fill="#161b22" />
    <rect y="16" width="230" height="8" fill="#161b22" />
    <text class="fs" x="115" y="15" fill="#8b949e" font-size="9" font-weight="600" text-anchor="middle">GPU Blob Anchor Map</text>

    <!-- Grid inside container -->
    <rect y="24" width="230" height="216" rx="12" fill="url(#grid)" />
    
    <!-- Render Area (Unclipped, unblurred circles showing tracking paths) -->
    <!-- Circles moving exactly in sync -->
    <g transform="translate(-80, 0)">
      <!-- Circles -->
      <circle class="blob1" cx="130" cy="110" r="28" fill="none" stroke="#8b5cf6" stroke-width="2" />
      <circle class="blob1" cx="130" cy="110" r="3" fill="#8b5cf6" />
      
      <circle class="blob2" cx="230" cy="150" r="32" fill="none" stroke="#ec4899" stroke-width="2" />
      <circle class="blob2" cx="230" cy="150" r="3" fill="#ec4899" />
      
      <circle class="blob3" cx="140" cy="210" r="36" fill="none" stroke="#06b6d4" stroke-width="2" />
      <circle class="blob3" cx="140" cy="210" r="3" fill="#06b6d4" />
      
      <circle class="blob4" cx="220" cy="220" r="24" fill="none" stroke="#10b981" stroke-width="2" />
      <circle class="blob4" cx="220" cy="220" r="3" fill="#10b981" />
    </g>

    <!-- Code metadata label overlay -->
    <rect x="15" y="190" width="200" height="34" rx="6" fill="rgba(6, 182, 212, 0.08)" stroke="rgba(6, 182, 212, 0.2)" />
    <text class="fs" x="115" y="203" fill="#06b6d4" font-size="8.5" font-weight="700" text-anchor="middle">4 CORE ANCHOR VECTORS</text>
    <text class="fs" x="115" y="216" fill="#8b949e" font-size="8" font-weight="500" text-anchor="middle">ACTIVE SPEED: 1.0 (60FPS)</text>
  </g>

  <!-- ════════════ BOTTOM PANEL: LIVE DEVELOPER TERMINAL ════════════ -->
  <g transform="translate(30, 310)" filter="url(#ds)">
    <rect width="800" height="186" rx="10" fill="rgba(13, 17, 23, 0.9)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect width="800" height="24" rx="10" fill="#161b22" />
    <rect y="16" width="800" height="8" fill="#161b22" />
    <circle cx="16" cy="12" r="4" fill="#ff5f56" /><circle cx="28" cy="12" r="4" fill="#ffbd2e" /><circle cx="40" cy="12" r="4" fill="#27c93f" />
    <text class="fs" x="400" y="16" fill="#8b949e" font-size="9" font-weight="600" text-anchor="middle">developer-console — react-native-liquid-gradients</text>
    <line x1="0" y1="24" x2="800" y2="24" stroke="rgba(255,255,255,0.05)" stroke-width="1" />

    <!-- Terminal Output -->
    <g transform="translate(20, 32)">
      <!-- Line 1: npm install command -->
      <text class="fm" y="4" font-size="9.5" fill="#58a6ff" font-weight="700">❯</text>
      <text class="fm" x="16" y="4" font-size="9.5" fill="#c9d1d9" clip-path="url(#clip-c1)">npm install react-native-liquid-gradients</text>
      <rect class="cur1" x="16" y="-7" width="6" height="12" fill="#58a6ff" />

      <!-- Success log after installation -->
      <g class="log1">
        <text class="fm" x="16" y="26" font-size="9.5" fill="#57ab5a">✔ Installed react-native-liquid-gradients@1.0.0 (GPU accelerated, 60FPS UI thread)</text>
      </g>

      <!-- Line 2: executing script -->
      <g class="log2">
        <text class="fm" y="48" font-size="9.5" fill="#58a6ff" font-weight="700">❯</text>
        <text class="fm" x="16" y="48" font-size="9.5" fill="#c9d1d9" clip-path="url(#clip-c2)">node run-gradient-test.js</text>
        <rect class="cur2" x="16" y="37" width="6" height="12" fill="#58a6ff" />
      </g>

      <!-- Execution logs -->
      <g class="log3" transform="translate(16, 72)">
        <text class="fm" font-size="9.5" fill="#8b949e">[Liquid Gradient] Initializing canvas node (Width: 390px, Height: 844px)...</text>
      </g>
      <g class="log4" transform="translate(16, 92)">
        <text class="fm" font-size="9.5" fill="#8b949e">[Liquid Gradient] Compiling GPU spring-driven animation threads...</text>
      </g>
      <g class="log5" transform="translate(16, 114)">
        <text class="fm" font-size="9.5" fill="#10b981">[ANIMATION] 60 FPS | Native UI Thread active | useNativeDriver: true</text>
      </g>
      <g class="log6" transform="translate(16, 134)">
        <text class="fm" font-size="9.5" fill="#a78bfa" font-weight="700">[STATUS] Running liquid-gradient loop dynamically (Blobs: 4, Speed: 1.0)</text>
      </g>
    </g>
  </g>
</svg>
